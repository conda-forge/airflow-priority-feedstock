schema_version: 1

context:
  name: airflow-priority
  version: "1.6.3"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/airflow-priority/airflow_priority-${{ version }}.tar.gz
  sha256: 4c3a430112662c7f48fdc6e84dcbb6a888036f57253eb0add8ad15e129a04758

build:
  number: 0
  noarch: python
  script:
    - ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - apache-airflow >=2.8,<4
    - pydantic >=2
  run_constraints:
    - airflow-config >=1.9

tests:
  - python:
      imports:
        - airflow_priority.common
      pip_check: true
      python_version:
        - =${{ python_min }}
        - "*"

about:
  license: Apache-2.0
  license_file: LICENSE
  summary: Priority Tags for Airflow Dags
  description: Priority Tags for Airflow Dags
  homepage: https://github.com/airflow-laminar/airflow-priority
  repository: https://github.com/airflow-laminar/airflow-priority

extra:
  recipe-maintainers:
    - timkpaine
